<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        viewport-fit=cover"
    >

    <meta name="theme-color" content="#090909">

    <title>Photo → Line Art</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <header class="header">

        <div>
            <div class="tag">
                PHOTO → LINE ART
            </div>

            <h1>
                Draw the photo.
            </h1>

            <p>
                Turn a portrait into clean pen-style
                line art and reveal it with an animated
                drawing stroke.
            </p>
        </div>

        <label class="upload">

            <input
                id="file"
                type="file"
                accept="image/*"
            >

            Choose photo

        </label>

    </header>


    <section class="card">

        <div class="stage">

            <canvas id="canvas"></canvas>

            <div id="loading">
                Loading…
            </div>

        </div>


        <div class="controls">

            <label>

                Detail

                <output id="detailV">
                    55
                </output>

                <input
                    id="detail"
                    type="range"
                    min="20"
                    max="90"
                    value="55"
                >

            </label>


            <label>

                Ink threshold

                <output id="thresholdV">
                    118
                </output>

                <input
                    id="threshold"
                    type="range"
                    min="60"
                    max="180"
                    value="118"
                >

            </label>


            <label>

                Line width

                <output id="widthV">
                    1.1
                </output>

                <input
                    id="width"
                    type="range"
                    min="0.5"
                    max="2.5"
                    step="0.1"
                    value="1.1"
                >

            </label>


            <label>

                Speed

                <output id="speedV">
                    1.0×
                </output>

                <input
                    id="speed"
                    type="range"
                    min="0.25"
                    max="3"
                    step="0.05"
                    value="1"
                >

            </label>

        </div>


        <div class="buttons">

            <button
                id="draw"
                class="primary"
            >
                ▶ Draw
            </button>

            <button
                id="pause"
                disabled
            >
                Ⅱ Pause
            </button>

            <button id="reset">
                ↺ Reset
            </button>

            <button id="save">
                ↓ PNG
            </button>

        </div>


        <div class="status">

            <span id="status">
                Preparing line art…
            </span>

            <span id="pct">
                0%
            </span>

        </div>


        <div class="bar">

            <i id="bar"></i>

        </div>

    </section>


    <footer>

        <b>Default image:</b>

        <code>
            assets/source.jpg
        </code>

        —

        Replace this file to customize
        the repository.

    </footer>

</main>


<script src="script.js"></script>

</body>
</html>
