<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Line2Image</title>

  <link rel="stylesheet" href="style.css">

  <!-- OpenCV.js -->
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>

<body>

  <div class="app">

    <header>
      <div class="brand">LINE2IMAGE</div>

      <h1>
        Turn a photo into<br>
        <span>line art.</span>
      </h1>

      <p>
        Upload a photograph and watch it transform into a clean
        hand-drawn style illustration.
      </p>
    </header>


    <section class="workspace">

      <div class="canvas-container">
        <canvas id="canvas"></canvas>

        <div id="loading" class="loading">
          Loading image…
        </div>
      </div>


      <div class="controls">

        <div class="control">
          <label>
            Detail
            <span id="detailValue">55</span>
          </label>

          <input
            id="detail"
            type="range"
            min="20"
            max="100"
            value="55"
          >
        </div>


        <div class="control">
          <label>
            Line width
            <span id="widthValue">1.2</span>
          </label>

          <input
            id="lineWidth"
            type="range"
            min="0.5"
            max="3"
            value="1.2"
            step="0.1"
          >
        </div>


        <div class="control">
          <label>
            Drawing speed
            <span id="speedValue">1×</span>
          </label>

          <input
            id="speed"
            type="range"
            min="0.25"
            max="3"
            value="1"
            step="0.25"
          >
        </div>

      </div>


      <div class="buttons">

        <label class="upload">
          <input
            id="imageInput"
            type="file"
            accept="image/*"
          >
          Choose image
        </label>

        <button id="generate">
          Convert to line art
        </button>

        <button id="draw">
          ▶ Draw
        </button>

        <button id="pause">
          Ⅱ Pause
        </button>

        <button id="reset">
          ↺ Reset
        </button>

        <button id="download">
          ↓ PNG
        </button>

      </div>


      <div class="progress-area">

        <div class="status">
          <span id="status">
            Loading…
          </span>

          <span id="percentage">
            0%
          </span>
        </div>

        <div class="progress">
          <div id="progressBar"></div>
        </div>

      </div>

    </section>


    <footer>

      <strong>Default image:</strong>

      <code>
        assets/source.jpg
      </code>

      <span>
        Replace this image to customize the project.
      </span>

    </footer>

  </div>


  <script src="script.js"></script>

</body>
</html>
